name: Hydroclimate Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true 

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libfontconfig1-dev \
            libfreetype6-dev \
            libtiff5-dev \
            libpng-dev \
            libjpeg-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            git-lfs \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev \
            libnetcdf-dev \
            libsqlite3-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libarchive-dev

      - name: Setup renv
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Install WhiteboxTools Engine
        run: |
          Rscript -e "if (!requireNamespace('whitebox', quietly = TRUE)) install.packages('whitebox', repos='https://cloud.r-project.org')"
          Rscript -e "whitebox::wbt_install()"

      - name: Run Pipeline
        run: |
          Rscript "terrain_runoff_pipeline.R"

      - name: Upload Pipeline Results
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: runoff-results-${{ github.run_number }}
          path: Runoff_pipeline_OUTPUT_1/
          retention-days: 7